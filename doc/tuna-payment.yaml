components:
  schemas:
    Account:
      description: The name of your account.
      type: string
    AppToken:
      description: The app token associated with your account.
      type: string
      format: uuid
    InitRequestSchema:
      type: object
      properties: &ref_0
        tokenSession:
          type: string
          description: >-
            Required only for payment with **credit card**. Here use the
            **sessionId** created at the [Token API endpoint "New Session"
            method.](/api/token#operation/NewSession)
          nullable: true
        partnerUniqueID:
          type: string
          description: Your unique ID for the order. It is used to track the order.
          nullable: true
        customer:
          type: object
          description: >-
            This object is used to pass on **customer data**, mainly for fraud
            prevention. Also, when using a saved card, only card tokens
            belonging to the user of this customer will work.
          nullable: true
          properties:
            iD:
              type: string
              description: A string that identifies the customer.
              nullable: true
            email:
              type: string
              description: Email.
              nullable: true
            name:
              type: string
              description: Full name.
              nullable: true
            document:
              type: string
              description: Document ID.
              nullable: true
            documentType:
              type: string
              description: >-
                Document ID type (pt-br: can be either "CPF" or "CNPJ"; can also
                be "SSN" or other types).
              nullable: true
            birthDate:
              type: string
              description: Birthday in date format.
              format: date
              nullable: true
            gender:
              type: string
              description: Customer's gender.
              nullable: true
            daysSinceRegistration:
              type: integer
              description: Days since customer's registration.
              format: int16
              nullable: true
            daysSinceLastLogin:
              type: integer
              description: Days since customer's last login date.
              format: int16
              nullable: true
            daysSinceLastPasswordChange:
              type: integer
              description: Days since customer's last password change date.
              format: int16
              nullable: true
            daysSinceLastPurchase:
              type: integer
              description: Days since customer's last purchase date.
              format: int16
              nullable: true
            daysSinceFirstPurchase:
              type: integer
              description: Days since customer's first purchase date.
              format: int16
              nullable: true
            data:
              type: object
              additionalProperties: {}
              description: Any additional data used to refer to the customer.
              nullable: true
        vendor:
          type: object
          description: >-
            This object is used to pass on **vendor data**. This is mainly used
            for fraud prevention.
          nullable: true
          properties:
            mCC:
              type: string
              description: Merchant Category Code (MCC).
              nullable: true
            code:
              type: string
              description: Commercial establishment of the vendor("EC" in Brazil).
