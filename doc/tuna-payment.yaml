        Notifies an event from a payment previously sent to Tuna.
        Current uses are chargebacks and orders delivery notifications.
      operationId: Notify Payment Event
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_101
            examples:
              Fraud chargeback:
                summary: Fraud chargeback
                value: *ref_102
              Dissatisfaction chargeback:
                summary: Dissatisfaction chargeback
                value: *ref_103
              Order Delivery:
                summary: Order delivery notification
                value: *ref_104
              Order Item Delivery:
                summary: Order item delivery notification
                value: *ref_108
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: *ref_105
              examples:
                Success:
                  summary: Notification succeeded
                  value: *ref_106
                Not found:
                  summary: Order not found
                  value: *ref_107
