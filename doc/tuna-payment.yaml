paths:
  /api/Payment/Init:
    post:
      summary: Init
      description: >
        The initial step's to create and perform the payment. The request body

        contains information regarding the purchase details and the payment

        method employed. For each payment method, there is a minimum set of

        required data. Please, refer to the examples on the right to get the

        meaningful ones for your company.


        Check out how to perform a [Payment
        Integration](/api/payment-integration)

        with our [Payment API](/api/payment) and [Token API](/api/token).
      operationId: Init
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_0
            examples:
              Template:
                summary: Example Template
                value: *ref_1
              Pix:
                summary: Payment (Pix)
                value: *ref_2
              Boleto:
                summary: Payment (Boleto)
                value: *ref_3
              Crypto:
                summary: Payment (Crypto)
                value: *ref_4
