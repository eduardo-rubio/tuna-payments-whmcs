                Four digits are used to represent the expiration year of the
                card.
              format: int16
              nullable: true
            singleUse:
              type: boolean
              description: >-
                Use **false** if it's a previously saved credit card (default).
                Use **true** if the token was generated for single use.
              nullable: true
            cVV:
