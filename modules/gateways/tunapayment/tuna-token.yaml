paths:
  /api/Token/NewSession:
    post:
      summary: New Session
      description: >
        Creates a new session. The **sessionId** returned must be used on all
        following api methods.
      operationId: NewSession
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_0
            examples:
              Template:
                summary: Example Template
                value: *ref_1
              Example:
                summary: Request Example
                value: *ref_2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: *ref_3
              examples:
                Template:
                  summary: Example Template
                  value: *ref_4
                Example:
                  summary: Response Example
                  value: *ref_5
